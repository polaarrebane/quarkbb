services:
  postgres-ethemeral:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
    restart: "no"
    environment:
      POSTGRES_DB: ${ETHEMERAL_DB}
      POSTGRES_USER: ${ETHEMERAL_USER}
      POSTGRES_PASSWORD: ${ETHEMERAL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dev"]
